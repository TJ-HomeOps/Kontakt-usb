name: Build KontaktUSB ISO

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (live-build needs ~15-20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Build the ISO inside a real Debian bookworm container
        run: |
          chmod +x build-distro.sh
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bookworm \
            bash -c "apt-get update && ./build-distro.sh"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kontaktusb-iso
          path: build/live-image-amd64.hybrid.iso
          retention-days: 14
